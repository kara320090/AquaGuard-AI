name: Daily AquaGuard Refresh

on:
  workflow_dispatch:
  schedule:
    # 09:00 KST = 00:00 UTC
    - cron: "0 0 * * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  KMA_API_KEY: ${{ secrets.KMA_API_KEY }}

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch live data and rebuild outputs
        run: |
          python scripts/07_build_final_features.py
          python scripts/14_fetch_oldam_reservoir_today.py
          python scripts/15_fetch_kma_asos_daily_30d.py
          python scripts/15b_fetch_kma_aws_daily_30d.py
          python scripts/17_fetch_adms_soil_moisture.py
          python scripts/18_fetch_adms_reservoir_support.py
          python scripts/16_build_live_features.py
          python scripts/09_generate_visuals.py
          python scripts/10_recommend_alternative_sources.py
          python scripts/12_build_reservoir_watchlist.py
          python scripts/11_final_validation.py

      - name: Commit refreshed outputs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed reports/tables reports/figures data/metadata data/raw/live_snapshots
          git diff --cached --quiet || git commit -m "chore: refresh generated outputs"
          git push
